name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jasmine --filter expression"
        required: false
        default: ""

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        # Release-era resolution of upstream's own 'lts/*' and 'node' labels
        # (May 2021). Node 8 cannot run the locked jasmine@3.7.0, whose
        # lib/loader.js uses dynamic import() -- a syntax error before Node 12.17.
        node_version: ['14', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npm run test:unit -- --filter="$TEST_FILTER"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npm run test:specs -- --filter="$TEST_FILTER"
          else
            npm run test:specs
          fi
      # lib/marked.js, lib/marked.esm.js and marked.min.js are rollup/uglify
      # output of src/ and are all listed in package.json#files (and
      # package.json#browser points at lib/marked.js), so they must be
      # regenerated from the patched sources or the packed tarball would ship
      # unpatched bundles. Upstream does this in its own Release job.
      - name: Build 🗜️
        if: matrix.node_version == '14'
        run: npm run build
      - name: Use the npm that packed the public tarball 🗜️
        if: matrix.node_version == '14'
        run: npm i -g npm@7.12.0
      - name: Pack 🗜️
        if: matrix.node_version == '14'
        run: npm pack
      - name: Upload Package Tarball 📦
        if: matrix.node_version == '14'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error

  Release:
    needs: [Test]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
